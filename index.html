<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="description"
      content="Glory Carriers helps cell groups plan events, coordinate tasks, and collaborate in real time."
    />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Glory Carriers" />
    <meta name="application-name" content="Glory Carriers" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" sizes="48x48" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="mask-icon" href="%BASE_URL%logo.svg" color="#1f74ff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <title>Glory Carriers</title>
    <script>
      (() => {
        try {
          const savedTheme = window.localStorage.getItem("glory-carriers-theme");
          const theme = savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <style>
      #startup-splash {
        position: fixed;
        z-index: 9999;
        inset: 0;
        display: grid;
        place-items: center;
        padding: calc(1.5rem + env(safe-area-inset-top)) 1.5rem calc(1.5rem + env(safe-area-inset-bottom));
        color: #22252b;
        background: #f7f8fa;
        opacity: 1;
        transition: opacity 220ms ease;
      }
      :root[data-theme="dark"] #startup-splash {
        color: #f5f5f5;
        background: #111111;
      }
      #startup-splash.is-leaving {
        opacity: 0;
        pointer-events: none;
      }
      .startup-splash-content {
        display: grid;
        justify-items: center;
        gap: .8rem;
        text-align: center;
        animation: startup-splash-enter 500ms cubic-bezier(.2,.7,.2,1) both;
      }
      .startup-splash-logo {
        display: block;
        width: clamp(7rem, 24vw, 10rem);
        height: auto;
        filter: drop-shadow(0 12px 26px rgb(15 23 42 / 12%));
      }
      .startup-splash-name {
        margin: .35rem 0 0;
        font: 800 clamp(1rem, 3vw, 1.25rem)/1.2 Inter, Manrope, system-ui, sans-serif;
        letter-spacing: .16em;
      }
      .startup-splash-tagline {
        margin: 0;
        color: #717782;
        font: 500 .88rem/1.45 Inter, Manrope, system-ui, sans-serif;
      }
      :root[data-theme="dark"] .startup-splash-tagline { color: #a9adb5; }
      .startup-splash-loader {
        display: flex;
        gap: .32rem;
        margin-top: .55rem;
      }
      .startup-splash-loader span {
        width: .36rem;
        height: .36rem;
        border-radius: 50%;
        background: #ea6f04;
        animation: startup-splash-dot 1s ease-in-out infinite alternate;
      }
      .startup-splash-loader span:nth-child(2) { animation-delay: 140ms; }
      .startup-splash-loader span:nth-child(3) { animation-delay: 280ms; }
      @keyframes startup-splash-enter {
        from { opacity: 0; transform: translateY(8px) scale(.985); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes startup-splash-dot {
        to { opacity: .35; transform: translateY(-3px); }
      }
      @media (prefers-reduced-motion: reduce) {
        #startup-splash, .startup-splash-content, .startup-splash-loader span {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="startup-splash" role="status" aria-label="Opening Glory Carriers">
      <div class="startup-splash-content">
        <img class="startup-splash-logo" src="%BASE_URL%icons/icon-512.png" width="512" height="512" alt="" fetchpriority="high" />
        <p class="startup-splash-name" aria-hidden="true">GLORY CARRIERS</p>
        <p class="startup-splash-tagline" aria-hidden="true">Growing together in Christ</p>
        <span class="startup-splash-loader" aria-hidden="true"><span></span><span></span><span></span></span>
      </div>
    </div>
    <div id="root" aria-busy="true"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
